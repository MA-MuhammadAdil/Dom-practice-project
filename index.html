<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Placeholder{
            width: 100px;
            height: 150px;
             
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        html,body{
        width: 100%;
        height: 100%;
        }
        
#main{
    display: flex; 
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 30px;
    background-color: #222;
}
 
.card {
    max-width: 300px !important;
    max-height: 300px;
    border-radius: 10px;
    background-color: rgb(43, 60, 60);
    padding: 20px !important;
    margin-top: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    word-wrap: break-word;  
}

.profile{
    width: 70px;
    height: 70px;
    border-radius: 50%;
    margin-bottom: 20px;
    background-color: red;
    overflow: hidden;
}
.profile img{
    height: 100%;
    width: 100%;
    object-fit: cover !important;

    
}
input{
    display: block;
}

.card p{
    font-size:20px ;
}

h2{
    margin-bottom: 10px;
    text-transform: capitalize;
}


h3{
    margin-bottom: 10px;
    text-transform: capitalize;
}

form{
    width: 300px;
    background-color: rgb(16, 48, 15);
    padding-top: 30px;
    border-radius: 20px;
    flex-direction:column;
    margin-bottom: 50px;
    padding: 20px;
}


form input{
    width: 250px;
    padding: 6px;
    height:50px;
    border-radius: 10px;
    margin: auto;
    margin-top: 10px;
}

#hidd{
    display: none;
}
#box{
    width: 150px ;
    height: 150px;
    display: flex;
    align-items: center;
    margin-top: 10px; 
    justify-content: center;
    border-radius: 5px;
    user-select: none;
    background-color: rgb(57, 67, 67);
}
    </style>
</head>
<body bgcolor="black" text="white">
 
  
<div id="main">
    <form action="#">
        <input required type="text" placeholder="Name">
        <input required type="occupation" placeholder="occupation">
        <input required type="text" placeholder="info">
        <input required id="hidd" type="file" placeholder="profile pic">
        <div id="box">
            Upload picture
        </div>
    <input type="submit">
</form>
</div>

</html>
